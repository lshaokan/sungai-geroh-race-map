<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geroh Map">
<meta name="theme-color" content="#f2f4f7">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sungai Geroh Race Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed map table. A floating HUD grid holds the title plate (top-left), the river ribbon (top-centre),
   compass + view stack (top-right), the detail card (left) and the counter dock (bottom). Light, single theme by request. */
:root{
  --land:#f2f4f7; --dot:#e2e7ee; --water:#92cdf3; --water-edge:#2a6fdb; --road:#ffffff; --road-edge:#c8d0db;
  --ink:#111418; --muted:#5b6573; --faint:#98a2b0; --panel:rgba(255,255,255,.96); --line:#d6dce5; --hover:#eef1f6;
  --accent:#1b4fd8; --accent-soft:#dfe7ff;
  --race:#1b4fd8; --safety:#d7263d; --hazard:#ffc300; --go:#1a9a4b;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --map:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--land);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
#map.tool{cursor:crosshair}
#map.armed{cursor:copy}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud>*{pointer-events:auto}
.plate{background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 8px 24px -10px rgba(17,20,24,.32),0 1px 2px rgba(17,20,24,.06)}
.tl{grid-area:1/1;justify-self:start;align-self:start;position:relative;z-index:6;display:flex;align-items:center;gap:4px;padding:6px 6px 6px 12px}
.tc{grid-area:1/2;align-self:start;justify-self:center;width:min(560px,100%);box-sizing:border-box;padding:6px 14px 6px}
.tr{grid-area:1/3/3/4;justify-self:end;align-self:start;display:flex;flex-direction:column;align-items:flex-end;gap:10px;background:none;pointer-events:none}
.tr>*{pointer-events:auto}
#card{grid-area:2/1/3/3;justify-self:start;align-self:start;width:300px;max-width:100%;max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.bl{grid-area:3/1;align-self:end;justify-self:start;pointer-events:none}
#dock{grid-area:3/1/4/4;justify-self:center;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;padding:6px;gap:0;max-width:100%;box-sizing:border-box}

/* title plate */
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:6px}
.brand b{font:700 17px var(--map);letter-spacing:.01em;white-space:nowrap}
.status{white-space:nowrap}
.status{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-top:2px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.ok i{background:var(--go)}
.status.join{cursor:pointer;text-decoration:underline;text-underline-offset:2px} .status.warn i{background:var(--hazard)}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
@media (hover:hover){.ib:hover,.ib[aria-expanded="true"]{background:var(--hover)}}
.ib svg{width:20px;height:20px}
.pop{position:absolute;top:calc(100% + 8px);left:0;width:290px;max-height:min(70vh,560px);overflow:auto;padding:10px;z-index:5;box-sizing:border-box}
.pop h4{margin:8px 6px 4px;font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pop h4:first-child{margin-top:2px}
.lrow{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px}
@media (hover:hover){.lrow:hover{background:var(--hover)}}
.lrow .g{width:24px;height:24px;flex:none;display:grid;place-items:center}
.lrow .g svg{width:22px;height:22px}
.lrow label{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column}
.lrow small{color:var(--faint);font-size:11px}
.lrow .loc{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
@media (hover:hover){.lrow .loc:hover{background:#fff;color:var(--ink)}}
.lrow .loc svg{width:16px;height:16px}
.sw{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;background:#cfd6e0;position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--ink)} .sw:checked::after{transform:translateX(14px)}
.help{display:grid;grid-template-columns:36px 1fr;gap:10px 10px;align-items:center;padding:6px}
.help svg{width:28px;height:28px}
.help span{line-height:1.3}

/* ribbon */
.rib{position:relative}
.rtop,.rbot{position:relative;height:16px}
.rbot{height:11px}
.pip{position:absolute;top:50%;transform:translate(-50%,-50%);display:block;pointer-events:none}
.pip svg{display:block}
.rtrack{display:flex;gap:2px;height:22px}
.rseg{flex:1 1 0;min-width:0;border-radius:4px;background:#d9e9fb;color:#0f3a8a;font:700 11px var(--map);overflow:hidden;white-space:nowrap;transition:background .15s}
.rseg:nth-child(even){background:#c5dcf6}
@media (hover:hover){.rseg:hover{background:#acccf2}}
.rseg.sel{background:var(--accent);color:#fff}
.rends{display:flex;justify-content:space-between;font:500 10.5px var(--map);color:var(--muted);margin-top:1px}

/* compass + view stack */
.compass{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.compass svg{width:34px;height:34px}
.vstack{display:flex;flex-direction:column;padding:4px;gap:2px}
.vb{width:56px;height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font:600 10.5px var(--map);letter-spacing:.02em}
.vb svg{width:24px;height:24px}
@media (hover:hover){.vb:hover{background:var(--hover);color:var(--ink)}}
.vb[aria-pressed="true"]{background:var(--ink);color:#fff}
.zstack{display:flex;flex-direction:column;padding:4px;gap:2px}
.zstack .ib{width:56px;height:38px}

/* card */
.chead{display:flex;align-items:center;gap:10px}
.chead h3{flex:1;min-width:0;margin:0;font:700 17px var(--map);line-height:1.15;text-wrap:balance}
.chead .big{width:40px;height:40px;flex:none}
.badge{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 14px var(--map);flex:none}
.sub{color:var(--muted);font-size:13px;margin-top:-6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fact{background:#f1f3f7;border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 13px var(--map);font-variant-numeric:tabular-nums}
.fact svg{width:20px;height:20px;color:var(--muted)}
.fact small{font:500 11px var(--ui);color:var(--muted)}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.mini{display:flex;align-items:center;gap:3px;background:#f1f3f7;border-radius:16px;padding:2px 8px 2px 2px;font:600 12.5px var(--map)}
.mini svg{width:24px;height:24px}
.lbl-s{font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:-6px}
.fromto{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.fromto b{color:var(--ink);font-weight:600}
.quote{background:#fff6d6;border-radius:10px;padding:10px 12px;line-height:1.4;white-space:pre-line;font-size:13.5px}
.inp{background:#f1f3f7;border:1px solid transparent;border-radius:10px;padding:9px 11px;width:100%;box-sizing:border-box}
.inp:focus{background:#fff;border-color:var(--line);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:80px;resize:vertical;line-height:1.4}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;font-weight:600;background:#f1f3f7}
@media (hover:hover){.btn:hover{background:#e4e8ef}}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--ink);color:#fff}
@media (hover:hover){.btn.primary:hover{background:#2a2f36}}
.btn.danger{color:var(--safety)}
.sides{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.side{border-radius:10px;background:#f1f3f7;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11.5px var(--map);color:var(--muted)}
.side svg{width:46px;height:20px}
.side[aria-pressed="true"]{background:var(--ink);color:#fff}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches .swc{width:25px;height:25px}
.swc svg{width:100%;height:100%;display:block}
.swc{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}

/* dock */
.tabs{display:flex;gap:2px;padding-right:6px;border-right:1px solid var(--line)}
.tab{width:62px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11.5px var(--map);color:var(--muted);padding:6px 0}
.tab svg{width:24px;height:24px}
@media (hover:hover){.tab:hover{background:var(--hover);color:var(--ink)}}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.tray{display:flex;gap:2px;overflow-x:auto;padding:0 6px;scrollbar-width:thin;min-width:0}
.tk{position:relative;width:62px;flex:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;font:600 11.5px var(--map);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:pan-x}
.tk svg{width:36px;height:36px;pointer-events:none}
.tk span{pointer-events:none;white-space:nowrap}
@media (hover:hover){.tk:hover{background:var(--hover)}}
.tk[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.tk b{position:absolute;top:2px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--ink);color:#fff;font:700 10.5px var(--map);display:grid;place-items:center;padding:0 4px;box-sizing:border-box;pointer-events:none}
.tool{position:relative;width:58px;flex:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 0;font:600 11.5px var(--map);color:var(--muted)}
.tool svg{width:24px;height:24px}
@media (hover:hover){.tool:hover{background:var(--hover);color:var(--ink)}}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
.vsep{width:1px;background:var(--line);margin:6px 4px;flex:none}
.cols{display:grid;grid-template-columns:repeat(3,22px);gap:6px;align-content:center;padding:0 6px}
.cols .swc{width:22px;height:22px}
.undo{border-left:1px solid var(--line);padding-left:6px;display:flex}
.undo .tool{color:var(--ink)}
.undo .tool:disabled{opacity:.3}

#hint{position:absolute;left:50%;transform:translate(-50%,0);display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;font-size:13px;font-weight:500;transition:opacity .3s;white-space:nowrap;z-index:4}
#hint svg{width:20px;height:20px;flex:none}
#hint .x{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
@media (hover:hover){#hint .x:hover{background:var(--hover)}}
#hint.fade{opacity:0;pointer-events:none}
#ghost{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;z-index:30;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
#tinput{position:absolute;z-index:20;min-width:160px;padding:7px 10px;border-radius:10px;border:2px solid var(--accent);background:#fff;font:600 14px var(--map);box-shadow:0 6px 18px -6px rgba(0,0,0,.35)}
.scale{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font:600 11px var(--map);color:var(--muted)}
.scale i{display:block;height:5px;border:2px solid var(--muted);border-top:0;box-sizing:border-box}

/* map drawing */
.lbl{font:600 11.5px var(--map);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3.2px;stroke-linejoin:round;transition:opacity .15s;pointer-events:none}
.lbl.big{font:700 13.5px var(--map)}
.lbl.m{fill:var(--muted);font-weight:500;font-size:11px}
.lbl.hid{opacity:0}
.road{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.hit{fill:none;stroke:transparent;stroke-width:30px;vector-effect:non-scaling-stroke;stroke-linecap:round;cursor:pointer}
.glow{fill:none;stroke:#ffc300;stroke-linecap:round;stroke-linejoin:round;opacity:0;pointer-events:none;transition:opacity .2s}
.sec.sel .glow{opacity:.9}
.mark{cursor:pointer}
.mark .ring,.item .ring,.cluster .ring{display:none}
.mark.sel .ring,.item.sel .ring{display:block}
.item{cursor:grab}
.cluster{cursor:zoom-in}
.ink{cursor:pointer}
.ink.sel{filter:url(#selglow)}
.lline{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:visibleStroke;cursor:pointer}
[data-level="1"] .l2,[data-level="1"] .l3,[data-level="2"] .l3{display:none}
.wp{cursor:grab}
.wp .ring{display:none}.wp.sel .ring,.wp.drop .ring,.mark.drop .ring{display:block}
.off-wp #gWp{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:3px;background:#f1f3f7;border-radius:18px;padding:3px 3px 3px 3px;font:600 12.5px var(--map);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.chip>svg{width:28px;height:28px;pointer-events:none}
.chip span{pointer-events:none;padding-right:2px}
.chip .x{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chip .x svg{width:14px;height:14px}
@media (hover:hover){.chip .x:hover{background:#fff;color:var(--ink)}}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:9px 10px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;line-height:1.3}
.dropzone svg{width:22px;height:22px;flex:none}
#card.drop .dropzone{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.namein{flex:1;min-width:0;font:700 17px var(--map);border:0;background:transparent;padding:4px 6px;margin-left:-6px;border-radius:8px}
.namein:hover{background:#f1f3f7}.namein:focus{background:#fff;outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.xbtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border-radius:10px;background:var(--ink);color:#fff;font:600 13px var(--ui);margin-left:4px;white-space:nowrap}
.xbtn svg{width:18px;height:18px}
@media (hover:hover){.xbtn:hover{background:#2a2f36}}
#xmodal,#jmodal{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.xback{position:absolute;inset:0;background:rgba(17,20,24,.38)}
.xpanel{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;background:#fff}
.xpanel h2{margin:0;font:700 20px var(--map)}
.xpanel p{margin:-8px 0 0;color:var(--muted);line-height:1.4}
.xg h5{margin:0 0 7px;font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.xg h5 span{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:flex;align-items:center;gap:7px;border-radius:10px;padding:9px 12px;background:#f1f3f7;font-weight:600;font-size:13.5px;border:2px solid transparent}
.opt i{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
@media (hover:hover){.opt:hover{border-color:var(--line)}}
.opt[aria-pressed="true"]{background:var(--oc);color:var(--of);border-color:var(--ink)}
.opt[aria-pressed="true"] i{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.xfoot{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.xmsg{color:var(--muted);font-size:13px;flex:1;min-width:160px}
.btn.big{padding:11px 16px;font-size:15px}
.btn:disabled{opacity:.5}
.snap *{transition:none!important}
.rbtn{background:#1b4fd8}
@media (hover:hover){.rbtn:hover{background:#163fae}}
.rivermode #hud,.rivermode #hint{display:none!important}
#jmodal{z-index:45}
#jpanel .inp{font-size:17px}
#river{position:absolute;inset:0;z-index:30;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));-webkit-user-select:none;user-select:none}
#river>*{pointer-events:auto}
.rv-top{display:flex;gap:10px;align-items:stretch}
.rv-exit{display:flex;align-items:center;gap:6px;height:58px;padding:0 18px;border-radius:16px;background:#111418;color:#fff;font:700 17px var(--map);flex:none}
.rv-exit svg{width:22px;height:22px}
.rv-gps{flex:1;min-width:0;min-height:58px;border-radius:16px;background:#fff;display:flex;align-items:center;gap:10px;padding:6px 14px;font:600 15px var(--map);line-height:1.25;box-shadow:0 8px 20px -10px rgba(0,0,0,.4);box-sizing:border-box}
.rv-gps i{width:13px;height:13px;border-radius:50%;background:#98a2b0;flex:none}
.rv-gps.ok i{background:#1a9a4b}.rv-gps.warn i{background:#ffc300}.rv-gps.bad i{background:#d7263d}
.rv-rec{width:58px;height:58px;border-radius:16px;background:#1b4fd8;color:#fff;display:grid;place-items:center;flex:none}
.rv-rec svg{width:28px;height:28px}
.rv-cross{position:absolute;width:40px;height:40px;pointer-events:none!important}
.rv-cross svg{width:40px;height:40px;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff)}
.rv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rv-btn{min-height:clamp(88px,13vh,124px);border-radius:20px;background:#fff;border:3px solid #111418;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font:700 clamp(15px,2.2vw,19px) var(--map);color:#111418;box-shadow:0 10px 22px -10px rgba(0,0,0,.45);padding:8px 6px;text-align:center;line-height:1.1;touch-action:manipulation}
.rv-btn svg{width:46px;height:46px;flex:none}
.rv-btn.haz{background:#ffc300}
.rv-btn.ok{background:#1a9a4b;color:#fff;border-color:#0f5c2c}.rv-btn.gone{background:#d7263d;color:#fff;border-color:#8e1424}
.rv-btn.ok svg,.rv-btn.gone svg{width:40px;height:40px}
.rv-btn:active{transform:scale(.96)}
.rv-grid.two{grid-template-columns:1fr 1fr}
.rv-grid.haz5{grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;flex:1;min-height:0}

  if(e&&(e.code==="invalid_argument"||e.code==="permission-denied")){canWrite=false;setArmed(null);setTool(null);setStatus("View only","warn");renderTray();renderCard();updUndo()}
  else if(e&&e.code==="quota_exceeded")setStatus("Plan is full","warn");else setStatus("Not saved · check signal","warn")})}
function store(col,id,data){if(db)chain(col+"/"+id,function(){return db.doc(col+"/"+id).set(data)});else saveLocal()}
function unstore(col,id){if(db)chain(col+"/"+id,function(){return db.doc(col+"/"+id).delete()});else saveLocal()}
function num(v,d){return typeof v==="number"&&isFinite(v)?v:d}
function hex(c){return typeof c==="string"&&/^#[0-9a-f]{6}$/i.test(c)?c:""}
function cleanItem(id,v){if(!v||!TYPE[v.type]||TYPE[v.type].fam==="point")return null;return{id:id,type:v.type,x:num(v.x,600),y:num(v.y,500),label:typeof v.label==="string"?v.label.slice(0,40):"",color:hex(v.color),side:/^[LMR]$/.test(v.side)?v.side:"",rep:cleanRep(v.rep)}}
function cleanRep(r){if(!r||typeof r!=="object")return undefined;var at=num(r.at,0);if(!at)return undefined;
  return{by:typeof r.by==="string"?r.by.slice(0,30):"Someone",at:at,acc:typeof r.acc==="number"&&isFinite(r.acc)?Math.round(r.acc):null,gps:!!r.gps}}
function cleanIcons(a){return Array.isArray(a)?a.filter(function(t){return typeof t==="string"&&TYPE[t]&&t!=="waypoint"}).slice(0,24):[]}
function cleanWp(id,v){if(!v)return null;return{id:id,name:typeof v.name==="string"?v.name.slice(0,40):"",color:hex(v.color)||"#d7263d",notes:typeof v.notes==="string"?v.notes.slice(0,2000):"",icons:cleanIcons(v.icons),x:num(v.x,600),y:num(v.y,500),rep:cleanRep(v.rep)}}
function cleanMx(v){if(!v)return null;return{color:hex(v.color),notes:typeof v.notes==="string"?v.notes.slice(0,2000):"",icons:cleanIcons(v.icons)}}
function cleanInk(v){if(!v||["pen","hl","arrow","text"].indexOf(v.kind)<0)return null;var c=hex(v.color)||"#111418";
  if(v.kind==="text"){if(typeof v.text!=="string"||!v.text.trim())return null;return{kind:"text",color:c,text:v.text.slice(0,120),x:num(v.x,0),y:num(v.y,0)}}
  if(!Array.isArray(v.pts)||v.pts.length<3||v.pts.length>9000||v.pts.length%3)return null;for(var i=0;i<v.pts.length;i++)if(typeof v.pts[i]!=="number"||!isFinite(v.pts[i]))return null;
  return{kind:v.kind,color:c,w:Math.max(.05,Math.min(80,num(v.w,2))),pts:v.pts}}
function startShared(store_){db=store_;items=new Map();notes={};ink=new Map();wps=new Map();mo={};renderItems();renderInk();renderPins();renderCard();setStatus("Loading plan","");
  var timer=setTimeout(function(){setStatus("Plan not reached yet","warn")},10000);
  db.collection("items").onSnapshot(function(snap){var next=new Map();snap.docs.forEach(function(d){var cur=items.get(d.id);if(drag===d.id&&cur){next.set(d.id,cur);return}var v=cleanItem(d.id,d.data());if(v)next.set(d.id,v)});
    items=next;if(sel&&sel.kind==="item"&&!items.has(sel.id))sel=null;renderItems();var ae=document.activeElement;if(!(ae&&ae.id==="item-label"))renderCard();
    if(!snap.metadata.fromCache){clearTimeout(timer);setStatus(canWrite?"Live":"View only",canWrite?"ok":"warn")}},function(){clearTimeout(timer);setStatus("Plan unavailable","warn")});
  db.collection("notes").onSnapshot(function(snap){var n={};snap.docs.forEach(function(d){var v=d.data()||{};if(typeof v.text==="string")n[d.id]=v.text});
    var ae=document.activeElement;if(ae&&ae.id==="sec-note"&&sel&&sel.kind==="sec")n[sel.id]=notes[sel.id];notes=n;if(!(ae&&(ae.id==="sec-note"||ae.id==="item-label")))renderCard()},function(){});
  function editing(){var ae=document.activeElement;return ae&&(ae.id==="pin-note"||ae.id==="wp-name")}
  db.collection("waypoints").onSnapshot(function(snap){var n=new Map();snap.docs.forEach(function(d){var cur=wps.get(d.id);if(dragWp===d.id&&cur){n.set(d.id,cur);return}var v=cleanWp(d.id,d.data());if(v)n.set(d.id,v)});
    if(editing()&&sel&&sel.kind==="wp"&&wps.get(sel.id)&&n.get(sel.id)){var a=wps.get(sel.id),b2=n.get(sel.id);b2.notes=a.notes;b2.name=a.name}
    wps=n;if(sel&&sel.kind==="wp"&&!wps.has(sel.id))sel=null;renderPins();if(!editing())renderCard()},function(){});
  db.collection("markx").onSnapshot(function(snap){var n={};snap.docs.forEach(function(d){var v=cleanMx(d.data());if(v)n[d.id]=v});
    if(editing()&&sel&&sel.kind==="mark"&&mo[sel.id]&&n[sel.id])n[sel.id].notes=mo[sel.id].notes;mo=n;renderPins();if(!editing())renderCard()},function(){});
  db.doc("brief/current").onSnapshot(function(d){if(d.exists){var ae=document.activeElement,nb=cleanBrief(d.data());if(ae&&ae.id==="wx-note")nb.note=brief.note;brief=nb;if(!$("xmodal").hidden)renderExport()}},function(){});
  db.collection("ink").onSnapshot(function(snap){var n=new Map();snap.docs.forEach(function(d){var v=cleanInk(d.data());if(v)n.set(d.id,v)});ink=n;if(sel&&sel.kind==="ink"&&!ink.has(sel.id)){sel=null;renderCard()}renderInk()},function(){});
}

/* ---------- Shared plan on the website: Firebase (on once FB_CONFIG is set) ---------- */
var FB_CONFIG=/*FBCONFIG*/null;
var fbUid=null,fbFs=null;
function loadJs(src){return new Promise(function(res,rej){var sc=document.createElement("script");sc.src=src;sc.onload=function(){res()};sc.onerror=function(){rej(new Error("Could not load "+src))};document.head.appendChild(sc)})}
async function startFirebase(){var B="https://www.gstatic.com/firebasejs/10.12.2/";setStatus("Connecting…","");
  try{await loadJs(B+"firebase-app-compat.js");await loadJs(B+"firebase-auth-compat.js");await loadJs(B+"firebase-firestore-compat.js");
    firebase.initializeApp(FB_CONFIG);fbFs=firebase.firestore();try{await fbFs.enablePersistence({synchronizeTabs:true})}catch(_){}
    var cred=await firebase.auth().signInAnonymously();fbUid=cred.user.uid;
    var mem=null;try{mem=await fbFs.doc("members/"+fbUid).get()}catch(_){}
    setWrite(!!(mem&&mem.exists));startShared(fbFs);
  }catch(e){setStatus("Offline: changes stay on this device","warn")}}
function setWrite(ok){canWrite=ok;if(!ok){setArmed(null);setTool(null)}renderTray();updUndo();renderCard();var st=$("status");st.classList.toggle("join",!ok);st.title=ok?"":"Tap to enter the team code"}
function joinSheet(){if(!fbFs)return;var m=$("jmodal");m.hidden=false;var pnl=$("jpanel");pnl.textContent="";
  var nm=h("input",{type:"text",className:"inp",id:"jName",maxLength:30,placeholder:"Your name",value:myName,autocomplete:"name"}),cd=h("input",{type:"text",className:"inp",id:"jCode",maxLength:40,placeholder:"Team code",autocomplete:"off",autocapitalize:"none"});
  var msg=h("span",{className:"xmsg"}),go2=h("button",{type:"button",className:"btn primary big",text:"Join"}),cl=h("button",{type:"button",className:"btn big",text:"Not now"});
  cl.onclick=function(){m.hidden=true};
  go2.onclick=async function(){var n=nm.value.trim(),c=cd.value.trim();if(!n||!c){msg.textContent="Enter your name and the team code.";return}go2.disabled=true;msg.textContent="Checking…";
    try{await fbFs.doc("members/"+fbUid).set({code:c,name:n,at:Date.now()});myName=n;try{localStorage.setItem("geroh-name",n)}catch(_){}m.hidden=true;setWrite(true);setStatus("Live","ok")}
    catch(e){msg.textContent=e&&e.code==="permission-denied"?"That code isn't right. Check with your team lead.":"Couldn't check the code. Try again when you have signal."}go2.disabled=false};
  pnl.appendChild(h("h2",{text:"Join the team"}));pnl.appendChild(h("p",{text:"Anyone can view the plan. To add or change things, enter your name and the team code once on this device."}));
  pnl.appendChild(nm);pnl.appendChild(cd);pnl.appendChild(h("div",{className:"xfoot"},[msg,cl,go2]));setTimeout(function(){(myName?cd:nm).focus()},50)}

/* ---------- Touch devices: keyboard + page-zoom guards ---------- */
document.addEventListener("gesturestart",function(e){e.preventDefault()},{passive:false});
document.addEventListener("dblclick",function(e){if(!e.target.closest("input,textarea"))e.preventDefault()},{passive:false});
if(window.visualViewport){var vvp=window.visualViewport;function vvFit(){var app=$("app"),kb=window.innerHeight-vvp.height;
    if(kb>80){app.style.height=vvp.height+"px";app.style.transform="translateY("+vvp.offsetTop+"px)"}else{app.style.height="";app.style.transform=""}}
  vvp.addEventListener("resize",vvFit);vvp.addEventListener("scroll",vvFit)}
function fitScale(){var bl=document.querySelector(".bl"),d=$("dock");if(!bl)return;bl.style.visibility="";var a=bl.getBoundingClientRect(),c=d.getBoundingClientRect();
  if(a.width&&a.right>c.left-4&&a.bottom>c.top)bl.style.visibility="hidden"}
window.addEventListener("resize",function(){setTimeout(fitScale,50)});setTimeout(fitScale,300);

/* ---------- Boot ---------- */
loadLocal();renderTabs();renderTray();updUndo();applyLayers();
view=fitView();apply();renderInk();renderPins();renderCard();setStatus("Saved on this device","");
try{if(!localStorage.getItem(TKEY))setTimeout(function(){if(tourI<0&&$("xmodal").hidden)startTour()},1400)}catch(_){}
if(window.ResizeObserver)new ResizeObserver(function(){var old=kfit,f=fitView();if(!touched)view=f;else view.k=kfit*(view.k/old);apply()}).observe(svg);
if(FB_CONFIG)startFirebase();
else if(window.claude&&window.claude.use){
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){var st=r[0],user=r[1];if(!st)return;
    var p=user&&user.can?Promise.resolve(user.can("data.write")).catch(function(){return null}):Promise.resolve(null);
    p.then(function(ok){if(ok===false){canWrite=false;setArmed(null);setTool(null);renderTray();updUndo()}startShared(st)})}).catch(function(){});
}
})();
